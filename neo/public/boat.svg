<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- Coque principale -->
  <path d="M20 80 Q30 95 60 98 L180 98 Q210 95 220 80 Z" stroke-width="2.5"/>
  <!-- Pont -->
  <line x1="50" y1="80" x2="200" y2="80" stroke-width="2"/>
  <!-- Cabine principale -->
  <rect x="100" y="58" width="65" height="22" rx="3" stroke-width="2"/>
  <!-- Fenêtres cabine -->
  <rect x="107" y="63" width="12" height="9" rx="1.5" stroke-width="1.5"/>
  <rect x="124" y="63" width="12" height="9" rx="1.5" stroke-width="1.5"/>
  <rect x="141" y="63" width="12" height="9" rx="1.5" stroke-width="1.5"/>
  <!-- Mât principal -->
  <line x1="128" y1="58" x2="128" y2="22" stroke-width="2"/>
  <!-- Vergue / bras de treuil -->
  <line x1="105" y1="32" x2="155" y2="32" stroke-width="1.5"/>
  <!-- Hauban -->
  <line x1="128" y1="22" x2="108" y2="58" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="128" y1="22" x2="148" y2="58" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- Cheminée -->
  <rect x="155" y="62" width="10" height="18" rx="2" stroke-width="2"/>
  <!-- Fumée légère -->
  <path d="M160 62 Q162 55 158 50 Q163 45 160 38" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.5"/>
  <!-- Proue (avant) avec étrave -->
  <path d="M20 80 Q12 85 10 98" stroke-width="2"/>
  <!-- Poupe (arrière) -->
  <path d="M220 80 Q228 85 230 98" stroke-width="2"/>
  <!-- Tirant de treuil à l'avant -->
  <line x1="55" y1="80" x2="55" y2="65" stroke-width="2"/>
  <line x1="40" y1="65" x2="72" y2="65" stroke-width="1.5"/>
  <!-- Câble de pêche avant -->
  <path d="M48 65 Q35 85 15 98" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
  <!-- Ligne de flottaison -->
  <line x1="15" y1="90" x2="225" y2="90" stroke-width="1" opacity="0.3" stroke-dasharray="8 4"/>
</svg>
